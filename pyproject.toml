[project]
name = "envoy"
version = "0.1.0"
description = "Envoy: the door banks can approve"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pynacl>=1.5",
  "httpx>=0.27",
  "openai>=1.40",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "singlestoredb>=1.0",
  "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services", "drills", "tests"]

[tool.ruff.lint]
# Every sponsor adapter falls back to mock on ANY failure by design, so blind excepts are intentional.
ignore = ["BLE001", "S110"]
